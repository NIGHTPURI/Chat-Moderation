tasks.register('finalLunaEvaluation', JavaExec) {
    group = 'verification'
    description = 'Runs the credential-gated final Luna 100% vs Phase 3.14/3.15 comparison.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.FinalLunaEvaluation'
    dependsOn testClasses
}

tasks.register('verifyProductionJar') {
    group = 'verification'
    description = 'Checks that the production JAR contains required classes and no test assets.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def paths = zipTree(jarFile).matching { include '**/*' }.files.collect { file ->
            file.path.replace('\\', '/')
        }
        def requiredSuffixes = [
                'dev/chatmoderation/core/ChatModerationService.class',
                'dev/chatmoderation/core/ChatModerationServices.class',
                'dev/chatmoderation/semantic/SemanticModerationProvider.class',
                'dev/chatmoderation/semantic/openai/OpenAiLunaModerationProvider.class',
                'dev/chatmoderation/defaults/profanity-keywords.txt',
                'module-info.class'
        ]
        requiredSuffixes.each { suffix ->
            if (!paths.any { it.endsWith(suffix) }) {
                throw new GradleException("production JAR is missing ${suffix}")
            }
        }
        def forbidden = paths.findAll { path ->
            path.contains('/test/')
                    || path.contains('/validation/')
                    || path.contains('gate-holdout')
                    || path.contains('gate-calibration')
                    || path.contains('policy-holdout')
                    || path.endsWith('.md')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("production JAR contains test/experiment assets: ${forbidden}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProductionJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
