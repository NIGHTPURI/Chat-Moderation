plugins {
    id 'java-library'
}

group = 'dev.chatmoderation'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('moderationPlayground', JavaExec) {
    group = 'verification'
    description = 'Runs the interactive local moderation playground.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ModerationPlayground'
    standardInput = System.in
    dependsOn testClasses
}

tasks.register('moderationBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the non-gating local moderation benchmark.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ModerationBenchmark'
    dependsOn testClasses
}

tasks.register('moderationEvaluation', JavaExec) {
    group = 'verification'
    description = 'Evaluates moderation accuracy without gating regression tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ModerationEvaluation'
    dependsOn testClasses
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
