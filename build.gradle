plugins {
    id 'java-library'
}

group = 'dev.chatmoderation'
version = '0.2.0'

java {
    modularity.inferModulePath = true
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('jar') {
    includeEmptyDirs = false
    manifest {
        attributes(
                'Implementation-Title': 'chat-moderation',
                'Implementation-Version': project.version
        )
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('moderationPlayground', JavaExec) {
    group = 'verification'
    description = 'Runs the interactive local moderation playground.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ModerationPlayground'
    standardInput = System.in
    dependsOn testClasses
}

tasks.register('moderationBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the non-gating local moderation benchmark.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ModerationBenchmark'
    dependsOn testClasses
}

tasks.register('moderationEvaluation', JavaExec) {
    group = 'verification'
    description = 'Evaluates moderation accuracy without gating regression tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ModerationEvaluation'
    dependsOn testClasses
}

tasks.register('semanticModerationEvaluation', JavaExec) {
    group = 'verification'
    description = 'Runs the local semantic moderation comparison experiment.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.SemanticModerationEvaluation'
    dependsOn testClasses
}

tasks.register('realSemanticModerationEvaluation', JavaExec) {
    group = 'verification'
    description = 'Runs the credential-gated real semantic provider comparison experiment.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.RealSemanticModerationEvaluation'
    dependsOn testClasses
}

tasks.register('openAiModerationEvaluation', JavaExec) {
    group = 'verification'
    description = 'Runs the credential-gated free OpenAI Moderation API experiment.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.OpenAiModerationEvaluation'
    dependsOn testClasses
}

tasks.register('moderationScoreCalibration', JavaExec) {
    group = 'verification'
    description = 'Calibrates Moderation API score thresholds and evaluates a sealed holdout.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ModerationScoreCalibrationEvaluation'
    dependsOn testClasses
}

tasks.register('lunaBaselineEvaluation', JavaExec) {
    group = 'verification'
    description = 'Runs the credential-gated GPT-5.6 Luna-only and frozen-router baseline.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.LunaBaselineEvaluation'
    dependsOn testClasses
}

tasks.register('highRecallRouterCalibration', JavaExec) {
    group = 'verification'
    description = 'Evaluates the Phase 3.14 router on calibration data only.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.HighRecallRouterCalibrationEvaluation'
    dependsOn testClasses
}

tasks.register('highRecallRouterEvaluation', JavaExec) {
    group = 'verification'
    description = 'Evaluates frozen and high-recall routers on the sealed Phase 3.14 holdout.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.HighRecallRouterHoldoutEvaluation'
    dependsOn testClasses
}

tasks.register('highRecallRouterLunaEvaluation', JavaExec) {
    group = 'verification'
    description = 'Runs the optional live Luna comparison on the sealed router holdout.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.HighRecallRouterLunaEvaluation'
    dependsOn testClasses
}

tasks.register('confidenceGateCalibration', JavaExec) {
    group = 'verification'
    description = 'Evaluates the Phase 3.15 gate on calibration and production-like data only.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ConfidenceGateCalibrationEvaluation'
    dependsOn testClasses
}

tasks.register('confidenceGateEvaluation', JavaExec) {
    group = 'verification'
    description = 'Evaluates the frozen Phase 3.15 gate on its sealed holdout.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.chatmoderation.validation.ConfidenceGateHoldoutEvaluation'
    dependsOn testClasses
